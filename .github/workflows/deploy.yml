name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          set -e

          # 1. Pull latest code (authenticated via the workflow token, clean reset)
          cd /root/punyo_go
          git fetch "https://x-access-token:${{ github.token }}@github.com/pmyge/punyo_go.git" main
          git reset --hard FETCH_HEAD

          # 2. Update Backend
          cd /root/punyo_go/punyo_go_backend
          source venv/bin/activate
          pip install -r requirements.txt
          python manage.py makemigrations
          python manage.py migrate
          python manage.py collectstatic --noinput
          sudo systemctl restart punyo_backend

          # 3. Update Bot
          cd /root/punyo_go/punyo_go_bot
          source venv/bin/activate
          pip install -r requirements.txt
          sudo systemctl restart punyo_bot

          # 4. Rebuild Frontend from source so new changes go live
          cd /root/punyo_go/punyo_go_frontend
          npm install
          npm run build
          sudo systemctl restart nginx
